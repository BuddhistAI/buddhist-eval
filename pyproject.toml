[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buddhist-eval"
version = "0.1.0"
authors = [
  { name="OpenPecha", email="dev@openpecha.org" },
]
description = "CER, WER and Span IoU-F1 scoring for Tibetan OCR, speech-to-text and span annotation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jiwer",
    "pyewts",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
]


[project.urls]
"Homepage" = "https://github.com/BuddhistAI/buddhist-eval"
"Bug Tracker" = "https://github.com/BuddhistAI/buddhist-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]
